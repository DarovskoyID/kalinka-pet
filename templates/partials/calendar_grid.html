<!-- Сетка месяца целиком строится во вьюхе (_calendar_context); листание — ссылки ?month=YYYY-MM -->
<div class="cal" id="calendar">
  <div class="cal-head">
    <div class="cal-nav">
      <a class="icon-btn" href="?month={{ cal_prev }}" aria-label="Предыдущий месяц"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
      <h2 class="cal-title">{{ cal_title }}</h2>
      <a class="icon-btn" href="?month={{ cal_next }}" aria-label="Следующий месяц"><svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
    </div>
    <a class="btn btn-ghost btn-sm" href="?">Сегодня</a>
  </div>
  <div class="cal-week">
    <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
  </div>
  <div class="cal-grid">
    {% for day in cal_days %}
    <div class="day{% if day.other %} is-other{% endif %}{% if day.today %} is-today{% endif %}">
      <span class="day-num">{{ day.date.day }}</span>
      <button class="icon-btn day-add" data-open="taskModal" data-date="{{ day.date|date:'Y-m-d' }}" aria-label="Добавить задачу">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      {% for task in day.tasks %}
      <a class="ev{% if task.status == 'complete' %} is-done{% endif %}"
         style="--c: rgb({{ task.project.color_Red }}, {{ task.project.color_Green }}, {{ task.project.color_Blue }})"
         title="{{ task.title }}"
         href="{% url 'task_edit' task.id %}?next={{ request.get_full_path|urlencode }}">{{ task.title }}</a>
      {% endfor %}
    </div>
    {% endfor %}
  </div>
</div>
